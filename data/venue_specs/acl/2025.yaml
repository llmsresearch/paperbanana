spec_version: 1
venue: acl
year: 2025
display_name: "ACL 2025 (A0 portrait)"
sources:
  - "https://2025.aclweb.org/faq/"
dimensions:
  # "Posters should be A0 size (33.1 x 46.8 inches) in portrait orientation."
  mode: exact
  width_mm: 841.0
  height_mm: 1189.0
  orientation: portrait
text_rules:
  min_pt: {}
  min_image_dpi: 100
required_elements:
  - id: paper_title
    description: "Poster must display the paper title"
    rule: text_level_present
    params: { level: title }
    severity: fail
  - id: authors
    description: "Poster should display the author list"
    rule: text_level_present
    params: { level: authors }
    severity: warn
file_rules: {}
notes: >-
  Poster PDF upload to Underline required (main: June 29; workshops:
  July 10, via the Speaker Form). ACL 2026 instructions were not yet
  published as of June 2026 ("Coming soon"); EMNLP 2025 publishes no
  dimensions and delegates to an external print form — A0 portrait remains
  the verifiable *ACL convention.
